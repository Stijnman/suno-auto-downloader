name: Suno Downloader Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q suno_downloader.py
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli2
          
      - name: Lint all markdown files
        run: |
          find . -name "*.md" -type f -not -path "./.git/*" -exec markdownlint-cli2 --config .markdownlint.json {} \;

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install codespell
        run: |
          pip install codespell
          
      - name: Check spelling
        run: |
          codespell --skip ".git,*.json,*.yml,*.yaml,CHANGELOG.md,node_modules" \
            --ignore-words-list "competitor,researcher,gemini,typescript,react,express,api,AI,http,https" \
            --check-filenames \
            --check-hidden

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@dc2edce2b667ca9bb1b1821d673b2385a491ff73
        with:
          path: ./
          extra_args: --only-verified

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pre-commit
        run: |
          pip install pre-commit
          npm install -g markdownlint-cli2
          
      - name: Install pre-commit hooks
        run: |
          pre-commit install
          
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure || echo "Pre-commit checks completed"
